const data=[
['발견','서울에는 <em>비싸도 잘 팔리는</em> 동네가 있다.','서울에서는 어디가 저렴한지만큼, 무엇을 구매하느냐에 따라 가격을 감수하는 소비의 모습도 다르게 나타난다.<br>우리는 서울시 생필품·농수축산물 가격정보와 상권분석 추정매출 데이터를 비교해, 가격이 높음에도 소비가 활발하게 나타나는 지역을 찾아보았다.<br>그 결과, 육류·청과·미곡 세 가지 품목에서 주목할 만한 지역들을 발견했다.'],
['가격 비교','정말 다른 지역보다 비쌀까?','먼저 육류·청과·미곡의 지역별 가격을 비교했습니다. 서울 평균 가격을 1로 설정하고,<br>평균보다 높은 가격에 판매되는 지역을 찾아보았습니다.'],
['소비 확인','비싼데도 소비가 활발한가?','가격이 높다는 사실만으로는 특별한 소비 현상이라고 보기 어렵습니다.<br>실제로 해당 지역에서 소비가 얼마나 활발하게 이루어지는지 추정매출 데이터를 통해 확인했습니다.'],
['유동인구 보정','단순히 사람이 많이 오가기 때문은 아닐까?','유동인구가 많은 지역은 그만큼 매출 규모도 클 수 있습니다.<br>사람들의 이동량 차이를 고려하더라도 소비가 활발하게 나타나는지 확인했습니다.'],
['소득 보정','소득 수준이 높아서 많이 소비하는 건 아닐까?','소득 수준이 높은 지역은 상대적으로 소비 여력이 클 수 있습니다.<br>지역별 소득 차이를 고려한 뒤에도 소비가 두드러지는 지역인지 확인했습니다.'],
['점포당 매출','가게가 많아서 매출이 높은 것은 아닐까?','점포 수가 많으면 지역 전체의 매출 규모도 커질 수 있습니다.<br>점포 수의 영향을 고려하기 위해 가게 한 곳당 평균적으로 발생하는 매출을 비교했습니다.'],
['검증 결과','그렇다면, 다섯 가지 기준을 모두 통과한 지역은?','가격에서 점포당 매출까지. 다섯 가지 질문을 함께 살펴봅니다.'],
['자유 탐색','다른 동네들은 어떤 결과를 보였을까?','궁금한 기준을 선택해 앞의 시각화를 다시 살펴보세요.']];
const story=document.querySelector('#story');data.forEach(([label,title,desc],i)=>{let s=document.createElement('section');s.id='scene-'+i;s.className=i===0?'intro':'';let content=i<6?`<img class="art" src="${embeddedAssets[`assets/scene-${i}.svg`]}" alt="${label} 시각화 — 제공된 슬라이드 원본 그래픽" ${i?'loading="lazy"':''}>`:i===6?`<div class="criteria">${data.slice(1,6).map((d,j)=>`<a class="criterion" href="#scene-${j+1}"><b>0${j+1}</b><span>${d[0]} ↗</span></a>`).join('')}</div><p class="note">제공된 슬라이드에는 최종 통과 지역과 상세 수치가 포함되어 있지 않습니다.<br>결과 데이터가 확정되면 이 장면에 연결됩니다.</p>`:`<div class="explore">${data.slice(1,6).map((d,j)=>`<a href="#scene-${j+1}"><small>0${j+1}</small><img src="${embeddedAssets[`assets/scene-${j+1}.svg`]}" alt=""><span>${d[0]} ↗</span></a>`).join('')}</div><p class="note">현재는 슬라이드의 검증 장면을 탐색할 수 있습니다. 자치구별 상세 탐색은 원본 데이터 연결이 필요합니다.</p><a class="restart" href="#scene-0">처음부터 다시 보기 ↑</a>`;s.innerHTML=`<div class="stage"><div class="copy"><p class="eyebrow">${i===0?'SEOUL / A CONSUMPTION STORY':i<6?`QUESTION 0${i} / 05`:i===6?'THE FIVE QUESTIONS':'EXPLORE THE STORY'}</p><${i?'h2':'h1'}>${title}</${i?'h2':'h1'}><p class="desc">${desc}</p>${i===0?'<p class="question">그런데, 이 지역들은 정말 비싸도 잘 팔리는 곳일까?<br><span style="font-weight:400;color:#bbb">이를 확인하기 위해 다섯 가지 기준으로 검증을 진행했다.</span></p>':''}</div>${content}</div>`;story.append(s)});
const nav=document.querySelector('#nav');nav.innerHTML=data.map((d,i)=>`<a href="#scene-${i}"><small>0${i+1}</small>${d[0]}</a>`).join('');const menu=document.querySelector('#menu');function close(){nav.hidden=true;menu.setAttribute('aria-expanded','false')}menu.onclick=()=>{nav.hidden=!nav.hidden;menu.setAttribute('aria-expanded',String(!nav.hidden))};nav.onclick=e=>{if(e.target.closest('a'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
let active=0,ticking=false;const sections=[...document.querySelectorAll('section')],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function update(){const vh=innerHeight,y=scrollY;let nearest=0;sections.forEach((s,i)=>{const r=s.getBoundingClientRect(),stage=s.firstElementChild;let entry=Math.min(1,Math.max(0,1-r.top/vh));let exit=Math.max(0,(vh-r.bottom)/(vh*.6));if(r.top<=vh*.4)nearest=i;if(!reduced){stage.style.opacity=Math.max(0,Math.min(1,entry*1.6)-exit);stage.style.transform=`translateY(${Math.max(0,r.top)*.055}px)`;const art=s.querySelector('.art');if(art)art.style.transform=`translateY(${(1-entry)*70}px) scale(${.96+entry*.04})`;}});active=nearest;document.querySelector('.chapter').textContent=data[active][0];document.querySelector('#counter').textContent=`0${active+1} / 08`;document.querySelector('.progress i').style.width=(y/(document.documentElement.scrollHeight-vh)*100)+'%';document.querySelector('#next').textContent=active===7?'↑ 처음으로':'다음 장면 ↘';nav.querySelectorAll('a').forEach((a,i)=>a.setAttribute('aria-current',i===active?'true':'false'));ticking=false}addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});addEventListener('resize',update);document.querySelector('#next').onclick=()=>sections[(active+1)%8].scrollIntoView({behavior:reduced?'auto':'smooth'});update();
</script></body></html>
